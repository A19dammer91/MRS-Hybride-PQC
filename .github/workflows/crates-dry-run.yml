name: Crates.io Dry Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo publish dry-run
        run: cargo publish --dry-run --allow-dirty
        
