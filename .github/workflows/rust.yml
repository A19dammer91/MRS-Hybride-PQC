name: Rust Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Installeer Rust
      run: rustup update stable

    - name: Voer Cargo Test uit
      run: cargo test --verbose
      
