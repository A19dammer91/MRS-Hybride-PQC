[package]
name         = "mrs_auth_pqc"
version      = "0.3.0"
edition      = "2021"
authors      = ["Bilal El Issaoui"]
description  = "Research-grade hybrid post-quantum KEM with Diophantine deniability. Not audited for production use."
license      = "MIT"
repository   = "https://github.com/A19dammer91/MRS-Hybride-PQC"
documentation = "https://docs.rs/mrs_auth_pqc"
readme       = "README.md"
keywords     = ["cryptography", "post-quantum", "kyber", "deniability", "diophantine"]
categories   = ["cryptography"]
rust-version = "1.70"

[lib]
name = "mrs_auth_pqc"
path = "src/lib.rs"

[dependencies]
pqc_kyber     = { version = "0.7", features = ["std", "kyber1024"] }
crypto_bigint = { version = "0.6", features = ["generic-array"] }
subtle        = { version = "2.6", default-features = false }
zeroize       = { version = "1.8", features = ["derive"] }
sha2          = "0.10"
hmac          = "0.12"
aes-gcm       = "0.10"
rand          = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name    = "sampler_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
